<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Luffy 3D — Three.js</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #1a1a2e;
      }
      canvas {
        display: block;
      }

      /* Panel info muncul saat objek diklik */
      #info {
        position: fixed;
        top: 16px;
        left: 16px;
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        padding: 10px 16px;
        border-radius: 8px;
        font-family: sans-serif;
        font-size: 14px;
        display: none; /* tersembunyi sampai diklik */
        pointer-events: none;
        border-left: 3px solid #e74c3c;
      }

      #info .nama {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 4px;
      }
      #info .keter {
        color: #ccc;
        font-size: 12px;
      }

      /* Tombol VR */
      #vrBtn {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 28px;
        background: #e74c3c;
        color: #fff;
        font-size: 13px;
        font-family: sans-serif;
        border: none;
        border-radius: 20px;
        cursor: pointer;
      }
      #vrBtn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <div class="nama" id="info-nama"></div>
      <div class="keter" id="info-keter"></div>
    </div>

    <button id="vrBtn">Masuk VR</button>

    <!-- canvas wajib ada id="c", tidak ada <script src="three..."> -->
    <canvas id="c"></canvas>
    <script type="module" src="app.js"></script>
  </body>
</html>
